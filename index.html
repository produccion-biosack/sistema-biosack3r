<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema | BioSack3R</title>
  
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <!-- Logo institucional de BioSack3R -->
        <img src="assets/biosack.png" alt="BioSack3R Logo" class="login-logo">
        <h2>Portal Interno</h2>
        <p>Ingresa tus credenciales corporativas</p>
      </div>

      <form id="formLogin" class="login-form">
        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input 
            type="email" 
            id="correo" 
            name="correo" 
            placeholder="usuario@biosack3r.com" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <div id="loginError" class="error-message" hidden></div>

        <button type="submit" id="btnLogin" class="btn-primary">
          <span>Ingresar</span>
        </button>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
